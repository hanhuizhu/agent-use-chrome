<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Use Chrome</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="header">
      <h1>Agent Use Chrome</h1>
      <div id="status" class="status status--unknown">未知</div>
    </header>

    <nav class="tabs">
      <button id="tabBtnChat" class="tab tab--active">聊天</button>
      <button id="tabBtnStatus" class="tab">状态</button>
    </nav>

    <!-- ==================== 聊天 Tab ==================== -->
    <section id="tabChat" class="tab-page">
      <div class="chat-topbar">
        <div id="sessionPicker" class="picker">
          <button id="pickerTrigger" class="picker__trigger" type="button">
            <span id="pickerLabel" class="picker__label">加载会话中…</span>
            <span class="picker__caret">▾</span>
          </button>
          <div id="pickerMenu" class="picker__menu hidden">
            <input id="pickerFilter" class="picker__filter" placeholder="搜索会话…" />
            <div id="pickerList" class="picker__list"></div>
          </div>
        </div>
        <button id="refreshSessions" class="icon-btn" title="刷新会话列表">⟳</button>
        <button id="settingsToggle" class="icon-btn" title="聊天设置">⚙</button>
      </div>
      <div id="projectRow" class="row hidden">
        <select id="projectSelect" class="select select--grow"></select>
      </div>
      <div id="settingsPop" class="settings-pop hidden">
        <label class="field">
          <span>权限模式（headless 执行）</span>
          <select id="permissionSelect" class="select">
            <option value="bypassPermissions">bypass（全部自动批准）</option>
            <option value="acceptEdits">acceptEdits（自动批准编辑）</option>
            <option value="default">默认（沿用已授权工具）</option>
          </select>
        </label>
        <p id="bypassWarn" class="warn">⚠ bypass 模式下浏览器内容可触发任意命令执行，仅在可信环境使用</p>
        <p class="hint">对正在终端中使用的会话发消息，可能造成历史分叉</p>
      </div>

      <div id="messages" class="messages">
        <div id="emptyState" class="empty-state">
          选择一个 CC 会话，输入消息即可对话
          <span>会话忙碌时消息自动排队，空闲后继续处理</span>
        </div>
      </div>

      <div class="composer">
        <div id="slashMenu" class="slash-menu hidden"></div>
        <textarea id="chatInput" rows="3" placeholder="发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="chatStop" class="btn btn--danger hidden" title="停止当前轮次并清空队列">■</button>
        <button id="chatSend" class="btn btn--primary">发送</button>
      </div>
    </section>

    <!-- ==================== 状态 Tab ==================== -->
    <section id="tabStatus" class="tab-page hidden">
      <section class="config">
        <div class="actions">
          <button id="save" class="btn btn--primary">保存并重连</button>
          <button id="stop" class="btn btn--danger">紧急停止</button>
        </div>
      </section>
    </section>

    <script src="panel.js"></script>
    <script src="markdown.js"></script>
    <script src="session-picker.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
